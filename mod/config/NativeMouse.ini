; NativeMouse — TOTK 1.4.2 native mouse camera
;
; Place this file at:  sdmc:/NativeMouse.ini
; Under Eden that is:  %APPDATA%\eden\sdmc\NativeMouse.ini

[NativeMouse]
; Master switch. When false the mod loads and does nothing.
Enabled = true

; Motion source: EdenHID (Eden's emulated HID mouse) or RawHelper (the
; external Raw Input companion, re/raw_helper.exe). Default EdenHID.
InputSource = EdenHID

; Mouse counts -> camera rotation. 1.0 is a good starting point.
; These multiply TOTK's own in-game camera sensitivity, so tune that too.
SensitivityX = 1.0
SensitivityY = 1.0

; Flip vertical look.
InvertY = false

; Extra multiplier applied while aiming (bow / scope). 1.0 = same as normal.
AimMultiplier = 1.0

; 0 = raw and linear (recommended, and the default this mod aims for).
; Values above 0 add optional exponential smoothing.
Smoothing = 0.0

; Write mouse activity to sdmc:/NativeMouse.log for troubleshooting.
DebugLog = false
